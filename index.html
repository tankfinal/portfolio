      ["上線前一天，老闆說按鈕想換個顏色。", "The day before launch, the boss wants the button in a different color."],
      ["那不是 bug，是 feature。", "That's not a bug, it's a feature."],
      ["註解寫『暫時這樣』的，通常活得比公司久。", "Code marked 'temporary' usually outlives the company."]
    ];

    function run(raw){
      var args = raw.split(/\s+/), cmd = args.shift(), rest = args.join(" ");
      switch (cmd) {
        case "": return;
        case "help":
          helpList();
          return;
        case "whoami":
          line("Tank Yang — Backend Senior Associate Manager @ XREX");
          return;
        case "neofetch":
          neofetch();
          return;
        case "ls":
          line("fukuoka/   busan/   yangmingshan/   averlyn/   activity   blocks   calc   calendar   README.md   contact   private/ 🔒");
          return;
        case "open":
          var id = resolveApp(rest);
          if (id === "terminal") { line("open: you're already in it 😄", "dim"); return; }
          if (id) { line("Opening " + appName(id) + "…", "dim"); open(id); }
          else if (rest) line("open: " + rest + ": no such app", "err");
          else line("usage: open <" + OPENABLE.join(" | ") + ">", "err");
          return;
        case "top":
          line("Opening " + appName("activity") + "…", "dim");
          open("activity");
          return;
        case "git":
          if (args[0] === "log") gitLog(args[1]);
          else line("usage: git log [" + REPOS.join(" | ") + "]", "err");
          return;
        case "kubectl":
          if (args[0] === "get" && /^(pods?|po)$/.test(args[1] || "")) pods();
          else line("usage: kubectl get pods", "err");
          return;
        case "sudo":
          if (/rm\s+-rf/.test(rest)) egg("這台是正式機欸，你是想害我禮拜五晚上加班嗎？🙃", "This is prod. Are you trying to get me paged on a Friday night?", "err");
          else egg("你又不是我老婆，sudo 什麼？這個家只有她有 root 權限。", "You're not my wife. In this house, only she has root.", "err");
          return;
        case "rm":
          egg("刪不掉啦，跟我手機裡的女兒照片一樣，一張都不准刪。", "Can't delete anything here. Same rule as the baby photos on my phone.", "err");
          return;
        case "deploy":
          if (new Date().getDay() === 5) egg("今天禮拜五，不部署。這是祖訓。", "It's Friday. We don't deploy on Fridays. Ancestral rule.", "err");
          else egg("部署前，先去拜一下綠色乖乖。（輸入 乖乖）", "Before you deploy, pay respects to the green Kuai Kuai. (try: 乖乖)", "yel");
          return;
        case "乖乖": case "kuaikuai":
          line("🟩 綠色乖乖（椰子口味）已放上機櫃", "grn");
          line("🙏 伺服器已加持，今日不當機。只能綠色，黃色紅色是在觸霉頭。", "grn");
          line("Green Kuai Kuai placed on the rack. Servers are blessed, no outages today. Only green works; yellow and red are bad luck.", "dim");
          return;
        case "vim": case "vi":
          egg("進得去，出不來。這裡沒有 vim，你安全了。", "Easy to get in, impossible to get out. No vim here, you're safe.", "yel");
          return;
        case "coffee": case "咖啡":
          egg("去 7-11 了，第二杯半價，要幫你買嗎？☕", "Gone to 7-Eleven. Second cup half price, want one? ☕", "yel");
          return;
        case "hi": case "hello": case "你好": case "哈囉":
          egg("呷飽未？", "Eaten yet? (How Taiwanese say hello.)", "grn");
          return;
        case "fortune":
          var f = FORTUNE[Math.floor(Math.random() * FORTUNE.length)];
          egg("🥠 " + f[0], f[1], "yel");
          return;
        case "bug":
          egg("不要叫，我在修。（其實在開會）", "Shh, I'm fixing it. (I'm in a meeting.)", "err");
          return;
        case "cat":
          if (/^readme(\.md)?$/i.test(rest)) line(t("hero.lede"));
          else if (rest) line("cat: " + rest + ": No such file or directory", "err");
          else line("usage: cat README.md", "err");
          return;
        case "contact":
          line("email     " + MAIL);
          line("github    github.com/tankfinal");
          line("linkedin  linkedin.com/in/zheng-yu-yang-807a5281");
          return;
        case "date":
          line(new Date().toString());
          return;
        case "clear":
          out.textContent = "";
          return;
        case "exit":
          close("terminal");
          return;
        default:
          line("zsh: command not found: " + cmd, "err");
      }
    }

    // Tab completes the command, then `open <app>` / `git log <repo>` arguments.
    function complete(){
      var v = input.value, m, pool, head;
      if ((m = /^(\S*)$/.exec(v))) { pool = CMDS; head = ""; }
      else if ((m = /^(open\s+)(\S*)$/.exec(v))) { pool = OPENABLE; head = m[1]; m = [0, m[2]]; }
      else if ((m = /^(git\s+log\s+)(\S*)$/.exec(v))) { pool = REPOS; head = m[1]; m = [0, m[2]]; }
      else if ((m = /^(git\s+)(\S*)$/.exec(v))) { pool = ["log"]; head = m[1]; m = [0, m[2]]; }
      else if ((m = /^(kubectl\s+)(\S*)$/.exec(v))) { pool = ["get pods"]; head = m[1]; m = [0, m[2]]; }
      else return;
      var hits = pool.filter(function(c){ return c.indexOf(m[1]) === 0; });
      if (hits.length === 1) input.value = head + hits[0] + (pool === OPENABLE || pool === REPOS ? "" : " ");
      else if (hits.length > 1) line(hits.join("   "), "dim");
    }

    line("Last login: " + new Date().toString().slice(0, 24) + " on ttys000", "dim");
    line("Welcome to TankOS. Commands you can run:");
    helpList();
    line("Tab completes · ↑↓ history · 'help' shows this again · 還有幾個彩蛋，自己找 🥚", "dim");
    line(" ");

    body.addEventListener("click", function(){
      if (!String(window.getSelection())) input.focus();
    });
    input.addEventListener("keydown", function(e){
      if (e.key === "Tab") { e.preventDefault(); complete(); return; }
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        if (!hist.length) return;
        hi = clamp(hi + (e.key === "ArrowUp" ? -1 : 1), 0, hist.length);
        input.value = hist[hi] || "";
        return;
      }
      if (e.key !== "Enter") return;
      var raw = input.value.trim();
      input.value = "";
      if (raw) hist.push(raw);
      hi = hist.length;
      var echo = document.createElement("div");
      echo.innerHTML = '<span class="ps">tank@TankOS ~ %</span> ';
      echo.appendChild(document.createTextNode(raw));
      out.appendChild(echo);
      run(raw);
      body.scrollTop = body.scrollHeight;
    });
  }

  /* ---------- desktop + dock ---------- */
  function select(b){
    document.querySelectorAll(".dicon.sel").forEach(function(x){ x.classList.remove("sel"); });
    if (b) b.classList.add("sel");
  }

  document.querySelectorAll(".dicon").forEach(function(b){
    b.addEventListener("click", function(e){
      // Touch screens and keyboard activation (detail 0) open right away; a mouse selects first and opens on double-click.
      if (coarse.matches || narrow.matches || e.detail === 0) { open(b.dataset.open); return; }
      select(b);
    });
    b.addEventListener("dblclick", function(){ open(b.dataset.open); });
  });

  dock.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click", function(){ open(b.dataset.open); });
  });

  desk.addEventListener("pointerdown", function(e){
    if (e.target.closest(".dicon")) return;
    select(null);
    blurAll();
  });

  window.addEventListener("resize", function(){
    Object.keys(wins).forEach(function(k){
      var el = wins[k].el;
      place(el, el.offsetLeft, el.offsetTop);
    });
    tick();
  });

  btnZh.addEventListener("click", function(){ setLang("zh"); });
  btnEn.addEventListener("click", function(){ setLang("en"); });

  var saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  if (!saved) saved = /^zh/i.test(navigator.language || "") ? "zh" : "en";
  setLang(saved === "en" ? "en" : "zh");
  setInterval(function(){ tick(); lockTick(); }, 1000);

  /* ---------- lock screen ---------- */
  var lock = document.getElementById("lock");
  var lkTime = document.getElementById("lkTime"), lkDate = document.getElementById("lkDate");
  var locked = true;

  function lockTick(){
    if (!locked) return;
    var d = new Date(), loc = lang === "en" ? "en-US" : "zh-TW";
    lkTime.textContent = new Intl.DateTimeFormat(loc, {hour:"numeric", minute:"2-digit", hour12:false}).format(d);
    lkDate.textContent = new Intl.DateTimeFormat(loc, {weekday:"long", month:"long", day:"numeric"}).format(d);
  }

  function unlock(){
    if (!locked) return;
    locked = false;
    if (still.matches) { lock.remove(); return; }
    lock.classList.add("out");
    setTimeout(function(){ lock.remove(); }, 560);
  }

  lock.hidden = false;
  lockTick();
  lock.addEventListener("click", unlock);
  lock.addEventListener("touchend", function(e){ e.preventDefault(); unlock(); });
  langHooks.push(lockTick);

  /* ---------- Spotlight ---------- */
  var spot = document.getElementById("spot");
  var spIn = document.getElementById("spIn"), spList = document.getElementById("spList"), spNone = document.getElementById("spNone");
  var spItems = [], spSel = 0;
  var btnSpot = document.getElementById("btnSpot");

  // Extra words each app should answer to, in both languages.
  var KW = {
    fukuoka:"福岡 九州 日本 自駕 熊本 別府 阿蘇 japan kyushu road trip",
    busan:"釜山 韓國 korea checklist 海",
    yangmingshan:"陽明山 慶生 生日 芒草 溫泉 birthday taipei",
    averlyn:"疫苗 女兒 寶寶 vaccine baby react vite",
    activity:"活動監視器 監控 狀態 延遲 uptime monitor status health top",
    blocks:"方塊 消除 遊戲 小遊戲 益智 俄羅斯方塊 block puzzle game 1010",
    readme:"關於 經歷 履歷 about bio resume experience",
    terminal:"終端機 shell cli zsh command",
    calc:"計算機 計算 算數 加減乘除 calculator calc math",
    calendar:"日曆 行事曆 月曆 日期 今天 農曆 放假 連假 calendar cal date today holiday",
    about:"關於 版本 版號 更新紀錄 about version changelog release",
    contact:"聯絡 email mail linkedin github",
    private:"私人 私密 登入 鎖 private login lock"
  };
  var EXP = [["XREX","e1"],["Binance","e2"],["CIMFORCE 上博科技","e3"],["Chiying Information Corp.","e4"],["Zyxel","e5"],["ARES International Corp.","e6"]];
  var STACK = ["Java","Spring Boot","Spring Cloud","Kafka","RabbitMQ","Redis","MySQL","Elasticsearch","StarRocks","Airflow","Spark","Flink","Docker","Kubernetes","AWS","TypeScript","React","Python","MCP"];

  function iconOf(id){
    if (id === "private") return '<span class="ic ic-private"><svg><use href="#g-lock"/></svg></span>';
    var src = document.querySelector('.icons [data-open="' + id + '"] .ic, .dock [data-open="' + id + '"] .ic');
    return src ? src.outerHTML : '<span class="ic ic-glyph">·</span>';
  }

  function index(){
    var items = [];
    ["fukuoka","busan","yangmingshan","averlyn","activity","blocks","terminal","calc","calendar","about","readme","contact","private"].forEach(function(id){
      items.push({label:appName(id), sub:"", kind:t("os.spot.app"), icon:iconOf(id), keys:(id + " " + KW[id]).toLowerCase(), go:function(){ open(id); }});
    });
    EXP.forEach(function(e){
      items.push({label:e[0], sub:t(e[1] + ".role") + " · " + t(e[1] + ".dur"), kind:t("os.spot.exp"), icon:iconOf("readme"), keys:e[0].toLowerCase(), go:function(){ open("readme"); }});
    });
    STACK.forEach(function(s){
      items.push({label:s, sub:"README.md", kind:t("os.spot.stack"), icon:'<span class="ic ic-glyph">' + s.charAt(0) + '</span>', keys:s.toLowerCase(), go:function(){ open("readme"); }});
    });
    items.push({label:t("os.spot.lang"), sub:"中 / EN", kind:t("os.spot.act"), icon:'<span class="ic ic-glyph">文</span>', keys:"language lang english 中文 語言 切換", go:function(){ setLang(lang === "zh" ? "en" : "zh"); }});
    items.push({label:t("os.spot.classic"), sub:"/classic/", kind:t("os.spot.act"), icon:'<span class="ic ic-classic">T</span>', keys:"classic 經典版 swiss", go:function(){ location.href = "classic/"; }});
    items.push({label:"GitHub", sub:"github.com/tankfinal", kind:t("os.spot.act"), icon:'<span class="ic ic-glyph">G</span>', keys:"github source code repo", go:function(){ window.open("https://github.com/tankfinal", "_blank", "noopener"); }});
    return items;
  }

  function score(it, q){
    var l = it.label.toLowerCase();
    if (l.indexOf(q) === 0) return 3;
    if (l.indexOf(q) > -1) return 2;
    return it.keys.indexOf(q) > -1 ? 1 : 0;
  }

  function search(){
    var q = spIn.value.trim().toLowerCase(), all = index();
    spItems = q
      ? all.map(function(it, i){ return {it:it, s:score(it, q), i:i}; })
           .filter(function(x){ return x.s; })
           .sort(function(a, b){ return b.s - a.s || a.i - b.i; })
           .slice(0, 8).map(function(x){ return x.it; })
      : all.slice(0, 8);
    spSel = 0;
    spList.innerHTML = spItems.map(function(it, i){
      return '<li role="option" data-i="' + i + '"' + (i === 0 ? ' class="on" aria-selected="true"' : '') + '>' + it.icon +
        '<span><b></b>' + (it.sub ? '<small></small>' : '') + '</span><em></em></li>';
    }).join("");
    // Labels go in as text, never as markup.
    spList.querySelectorAll("li").forEach(function(li, i){
      li.querySelector("b").textContent = spItems[i].label;
      if (spItems[i].sub) li.querySelector("small").textContent = spItems[i].sub;
      li.querySelector("em").textContent = spItems[i].kind;
    });
    spNone.hidden = !!spItems.length || !q;
  }

  function mark(i){
    var lis = spList.querySelectorAll("li");
    if (!lis.length) return;
    spSel = (i + lis.length) % lis.length;
    lis.forEach(function(li, k){ li.classList.toggle("on", k === spSel); li.setAttribute("aria-selected", k === spSel); });
    lis[spSel].scrollIntoView({block:"nearest"});
  }

  function spotOpen(){
    if (locked) unlock();
    spot.hidden = false;
    spIn.placeholder = t("os.spot.ph");
    spIn.value = "";
    search();
    spIn.focus();
  }
  function spotClose(){ spot.hidden = true; }
  function spotGo(i){ var it = spItems[i]; if (!it) return; spotClose(); it.go(); }

  spIn.addEventListener("input", search);
  spIn.addEventListener("keydown", function(e){
    if (e.key === "ArrowDown") { e.preventDefault(); mark(spSel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); mark(spSel - 1); }
    else if (e.key === "Enter") { e.preventDefault(); spotGo(spSel); }
  });
  spList.addEventListener("click", function(e){
    var li = e.target.closest("li");
    if (li) spotGo(+li.dataset.i);
  });
  spList.addEventListener("pointermove", function(e){
    var li = e.target.closest("li");
    if (li && +li.dataset.i !== spSel) mark(+li.dataset.i);
  });
  spot.addEventListener("pointerdown", function(e){ if (e.target === spot) spotClose(); });
  btnSpot.addEventListener("click", spotOpen);

  document.addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (spot.hidden) spotOpen(); else spotClose();
      return;
    }
    if (locked) {
      if (!e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); unlock(); }
      return;
    }
    if (e.key === "Escape" && !spot.hidden) { spotClose(); return; }
    var typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "/" && !typing && spot.hidden && focused !== "calc") { e.preventDefault(); spotOpen(); }
  });

  if (!narrow.matches) open("readme");
})();
</script>
